name: CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax and security regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic-settings python-dotenv loguru pillow numpy
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run focused regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_security_regressions.py -q

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        run: npm run build

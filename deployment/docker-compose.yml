version: "3.9"

services:
  # ------------------------------------------------------------------
  # Infrastructure: Milvus dependencies
  # ------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: wenxinlens-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: wenxinlens-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: wenxinlens-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ------------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: wenxinlens-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-wenxinlens}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Neo4j
  # ------------------------------------------------------------------
  neo4j:
    image: neo4j:5.17-community
    container_name: wenxinlens-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wenxinlens}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------------
  # Backend FastAPI
  # ------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: wenxinlens-backend
    env_file:
      - ../.env
    environment:
      MILVUS_HOST: milvus
      REDIS_URL: redis://:${REDIS_PASSWORD:-wenxinlens}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - model_cache:/root/.cache

  # ------------------------------------------------------------------
  # Frontend Next.js
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: wenxinlens-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ------------------------------------------------------------------
  # Nginx reverse proxy
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: wenxinlens-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  model_cache:
